<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a111b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MTC Makros"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>MTC Makrotracker</title>
<style>
@font-face{font-family:"Chakra Petch";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/chakra-petch-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Chakra Petch";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/chakra-petch-latin-700-normal.woff2) format("woff2")}
/* ================= MTC Makrotracker v9 – Look & Bedienung wie der MTC Muskelatlas =================
   Palette 1:1 aus dem Muskelatlas: tiefes Blau-Schwarz, Holo-Cyan für Daten, Violett als Aktionsfarbe.
   Systemschrift für Text & Zahlen, „Chakra Petch“ nur für die Marke. */
:root{
  --stage:#04070c;--bg:#0a111b;--card:#0f1926;--fill:#172434;--fill-2:#1f2f43;--ink:#dbe8f5;--ink-2:#8199b1;--hair:#1c2b3d;
  --holo:#5fe1ff;--accent:#b57bff;--accent-ink:#0a0612;--accent-soft:rgba(181,123,255,.14);--holo-soft:rgba(95,225,255,.12);
  --warn:#ffc861;--alert:#ff7a85;--ok:#7ee0a5;
  --p:#b57bff;--c:#ffc861;--f:#5fe1ff;--fib:#7ee0a5;--water:#5fe1ff;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-brand:"Chakra Petch",var(--font);
  --r-lg:22px;--r-md:16px;--r-sm:12px;color-scheme:dark;
  /* Kurznamen für ältere Bausteine */
  --fg:var(--ink);--muted:var(--ink-2);--line:var(--hair);--sep:var(--hair);--danger:var(--alert);--star:var(--warn);
  --surface:var(--card);--surface-2:var(--fill);--card-2:var(--fill);--brand:var(--accent);--line-hi:rgba(181,123,255,.45);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:radial-gradient(ellipse 90% 40% at 70% -10%,#121c2d 0%,var(--bg) 70%) fixed,var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;padding:0 16px}
.app{max-width:720px;margin:0 auto;padding-bottom:40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--holo);outline-offset:2px}
.num,.big,.stat b,.kcal{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}.small{font-size:13px}
.sub{margin:2px 0 0;font-size:14px;color:var(--ink-2);line-height:1.45}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.emo{font-style:normal;margin-right:6px}
h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
h3{font-size:17px;font-weight:650;letter-spacing:-.01em;margin:0}
.stack{display:flex;flex-direction:column;gap:12px}
#view{padding-top:2px}
#view>.group-title:first-child{margin-top:4px}

/* ---------- Kopfzeile ---------- */
.top{position:sticky;top:0;z-index:15;margin:0 -16px;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:rgba(10,17,27,.78);-webkit-backdrop-filter:saturate(1.5) blur(20px);backdrop-filter:saturate(1.5) blur(20px);border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--hair)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo{height:30px;width:auto;display:block;filter:drop-shadow(0 0 8px rgba(95,225,255,.35))}
.brand-word{font-family:var(--font-brand);display:grid;line-height:1.15;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.brand-word b{font-size:16px;letter-spacing:.1em;font-weight:700}
.top-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(10,17,27,.62);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.top-pill:empty{display:none}
.top-pill.holo{color:var(--holo)}.top-pill.ok{color:var(--ok)}

/* ---------- Große Titel ---------- */
.lt{font-size:32px;font-weight:800;letter-spacing:-.03em;margin:6px 0 0;line-height:1.1}
.lt-sub{color:var(--ink-2);font-size:15px;margin:2px 0 0}
.lt-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.lt-nav{display:flex;gap:6px;align-items:center;flex:none;padding-bottom:2px}
.round{width:36px;height:36px;border-radius:50%;border:0;background:var(--fill);color:var(--ink);display:grid;place-items:center;font-size:20px;line-height:1;padding:0}
.round.on{background:var(--accent);color:var(--accent-ink)}
.pill-btn{border:0;background:var(--accent-soft);color:var(--accent);font-weight:650;font-size:14px;padding:8px 14px;border-radius:999px;min-height:36px}
.group-title{margin:16px 4px 8px;font-size:13px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.group-title>span:last-child:not(:first-child){text-transform:none;letter-spacing:0;font-weight:500}
.group-title button,.group-title a{border:0;background:none;color:var(--accent);text-transform:none;letter-spacing:0;font-weight:600;font-size:14px;padding:0;text-decoration:none}
.stack>.group-title{margin:6px 4px -4px}
.foot-note{margin:14px 16px 0;font-size:12.5px;color:var(--ink-2);text-align:center}
.eyebrow{font-size:12px;font-weight:700;color:var(--holo);text-transform:uppercase;letter-spacing:.06em;font-family:var(--font-brand)}

/* ---------- Karten & Listen ---------- */
.card{background:var(--card);border-radius:var(--r-md);box-shadow:0 0 0 1px var(--hair);padding:14px 16px}
.glist,.list{background:var(--card);border-radius:var(--r-md);box-shadow:0 0 0 1px var(--hair);overflow:hidden}
.nav-row{display:grid;grid-template-columns:34px 1fr auto 12px;align-items:center;gap:12px;width:100%;min-height:54px;padding:10px 14px;border:0;background:none;color:var(--ink);text-align:left;font-size:16px;text-decoration:none;position:relative}
.nav-row+.nav-row::before,.list>*+*::before{content:"";position:absolute;top:0;left:60px;right:0;height:1px;background:var(--hair)}
.nav-row:active{background:rgba(255,255,255,.03)}
.nr-ico,.ico{width:34px;height:34px;border-radius:10px;background:var(--fill);display:grid;place-items:center;font-size:18px;flex:none}
.nr-main{font-weight:600;min-width:0}
.nr-sub{display:block;font-size:13.5px;color:var(--ink-2);font-weight:500;margin-top:1px}
.nr-val{color:var(--ink-2);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.nr-val.holo{color:var(--holo)}
.chev{width:8px;height:8px;border-right:2px solid var(--ink-2);border-top:2px solid var(--ink-2);transform:rotate(45deg)}
.tg-row{grid-template-columns:34px 1fr auto}
.tg-main{border:0;background:none;text-align:left;padding:0;min-width:0;color:var(--ink)}
.back{border:0;background:none;color:var(--accent);font-weight:600;font-size:16px;padding:6px 0;min-height:40px;align-self:flex-start}
.subpage .card>div:first-child>h3{display:none}
.subpage details.card>summary{display:none}

/* ---------- Knöpfe & Eingaben ---------- */
.btn{min-height:44px;border:0;border-radius:var(--r-sm);font-size:15px;font-weight:650;padding:10px 16px;background:var(--fill);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 0 0 1px var(--hair)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 22px rgba(181,123,255,.28);font-weight:700}
.btn.danger{background:transparent;color:var(--alert);box-shadow:0 0 0 1px rgba(255,122,133,.4)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.sm{min-height:36px;padding:7px 12px;font-size:14px}
.btn.wide{width:100%}
.btn.big{min-height:52px;font-size:16.5px}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.text-btn{border:0;background:none;color:var(--accent);font-weight:650;font-size:15px;padding:10px;min-height:44px}
.icon-btn{width:40px;height:40px;flex:none;border-radius:50%;border:0;background:var(--fill);color:var(--ink-2);font-size:20px;line-height:1;display:grid;place-items:center;padding:0}
.mini{border:0;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:650;background:var(--accent-soft);color:var(--accent);white-space:nowrap;min-height:36px}
.mini.holo{background:var(--holo-soft);color:var(--holo)}
.chip-btn{border:0;background:var(--fill);color:var(--ink);border-radius:999px;padding:8px 12px;font-size:13.5px;font-weight:600;min-height:36px;white-space:nowrap}
.inline-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.label{font-size:13px;color:var(--ink-2);font-weight:600}
.input{border:1px solid var(--hair);background:var(--fill);border-radius:var(--r-sm);padding:11px 12px;width:100%;min-width:0;font-size:16px;color:var(--ink)}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.input.sm{width:100px}
.input::placeholder{color:#5d7590}
select.input option{background:var(--card)}
textarea.input{min-height:84px;line-height:1.4}
textarea.mono{font-family:ui-monospace,monospace;font-size:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:520px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.goalrow-title{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
details>summary{cursor:pointer;font-weight:600;color:var(--accent);min-height:36px;display:flex;align-items:center}
details>summary::-webkit-details-marker{display:none}
details>summary{list-style:none}

/* Segmente (wie im Muskelatlas: gefüllte Schiene, aktiver Teil hebt sich ab) */
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:2px;border-radius:10px;background:var(--fill)}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px 12px;font-size:14px;font-weight:550;color:var(--ink-2);min-height:34px}
.seg button[aria-pressed="true"]{background:var(--hair);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.4);font-weight:650}
.seg-full{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;width:100%}
.seg-full button{padding:7px 4px}
/* Schalter */
.switch{display:flex;align-items:center;justify-content:space-between;flex-direction:row-reverse;gap:14px;width:100%;font-weight:500;cursor:pointer}
.switch input,.tgl{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:999px;background:#253447;position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
.switch input::after,.tgl::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .2s}
.switch input:checked,.tgl:checked{background:var(--accent)}
.switch input:checked::after,.tgl:checked::after{transform:translateX(20px)}
.switch input:disabled{opacity:.5}

/* Hinweis-Banner */
.banner{background:var(--card);box-shadow:0 0 0 1px rgba(181,123,255,.45),0 0 26px rgba(181,123,255,.08);border-radius:var(--r-md);padding:12px 14px;font-size:14.5px;display:flex;gap:10px 12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.warn{box-shadow:0 0 0 1px rgba(255,122,133,.45)}
.banner.nudge{box-shadow:0 0 0 1px rgba(95,225,255,.35)}
.banner .row{display:flex;gap:8px;flex-wrap:wrap}
#banner:not(:empty){margin:8px 0}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.pill.ok{background:rgba(126,224,165,.14);color:var(--ok)}
.pill.warn{background:rgba(255,200,97,.16);color:var(--warn)}
.pill.low{background:var(--fill);color:var(--ink-2)}
.pill.train{background:var(--accent-soft);color:var(--accent)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);vertical-align:1px;margin-left:6px}
.tag.holo{background:var(--holo-soft);color:var(--holo)}
.tag.fav{background:rgba(255,200,97,.14);color:var(--warn)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:0}
.dot.p{background:var(--p)}.dot.c{background:var(--c)}.dot.f{background:var(--f)}

/* ---------- Tab-Leiste mit zentralem Eintragen-Knopf ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);align-items:start;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));
  background:rgba(10,17,27,.92);-webkit-backdrop-filter:saturate(1.5) blur(20px);backdrop-filter:saturate(1.5) blur(20px);border-top:1px solid var(--hair)}
.tabs button[role=tab]{border:0;background:none;display:grid;justify-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--ink-2);padding:2px 0;min-height:48px}
.tabs button[role=tab] svg{width:25px;height:25px}
.tabs button[aria-selected="true"]{color:var(--accent)}
.fab{width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-22px;justify-self:center;
  box-shadow:0 0 0 5px var(--bg),0 8px 26px rgba(181,123,255,.45);font-size:30px;font-weight:500;line-height:1;padding:0}
.fab svg{width:26px;height:26px}
.fab .fab-txt{display:none}
.fab:active{transform:scale(.96)}
@media (max-width:640px){.app{padding-bottom:110px}}
@media (min-width:641px){
  .tabs{position:static;display:flex;gap:6px;justify-content:center;align-items:center;margin:10px 0 6px;padding:5px;background:var(--card);border:0;box-shadow:0 0 0 1px var(--hair);border-radius:16px}
  .tabs button[role=tab]{grid-auto-flow:column;gap:8px;font-size:14.5px;padding:8px 14px;border-radius:11px;min-height:40px;align-items:center}
  .tabs button[role=tab] svg{width:20px;height:20px}
  .tabs button[aria-selected="true"]{background:var(--fill);color:var(--ink)}
  .tabs button[aria-selected="true"] svg{color:var(--accent)}
  .fab{order:5;width:auto;height:40px;margin:0 0 0 auto;border-radius:11px;padding:0 16px 0 12px;box-shadow:0 4px 18px rgba(181,123,255,.3);display:flex;gap:6px;font-size:15px;font-weight:700}
  .fab svg{width:20px;height:20px}
  .fab .fab-txt{display:inline}
}

/* ---------- Heute ---------- */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:12px}
.wd{position:relative;border:0;color:var(--ink);background:var(--card);box-shadow:0 0 0 1px var(--hair);border-radius:12px;padding:7px 0 7px;display:grid;justify-items:center;gap:1px;min-width:0}
.wd-day{font-size:11px;font-weight:600;color:var(--ink-2);text-transform:uppercase}
.wd-num{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.wd-k{font-size:10.5px;color:var(--holo);font-weight:700;font-style:normal;font-variant-numeric:tabular-nums}
.wd.none{background:none;box-shadow:inset 0 0 0 1px var(--hair)}
.wd.none .wd-k{color:var(--ink-2);font-weight:600}
.wd.off .wd-k{color:var(--warn)}
.wd.future{opacity:.45}
.wd.today{box-shadow:0 0 0 2px var(--holo)}
.wd.today .wd-day{color:var(--holo)}
.wd.sel:not(.today){box-shadow:0 0 0 2px var(--accent)}
.wd.sel{background:var(--fill)}
.wd-ok{position:absolute;top:-5px;right:-4px;width:16px;height:16px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:10px;font-weight:800;font-style:normal;box-shadow:0 0 0 2px var(--bg)}
.hero{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center;padding:16px;background:linear-gradient(160deg,#111d2d,#0d1622);box-shadow:0 0 0 1px var(--hair),0 0 40px rgba(95,225,255,.06)}
.ring-wrap{position:relative;width:132px;height:132px}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-wrap .prog{filter:drop-shadow(0 0 6px rgba(95,225,255,.5))}
.ring-center{position:absolute;inset:0;display:grid;place-items:center;align-content:center;text-align:center}
.ring-center .big{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ring-center .lbl{font-size:11.5px;color:var(--ink-2);margin-top:3px}
.ring-center.over .big{color:var(--alert)}
.mac{display:grid;gap:9px;min-width:0}
.mh{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600}
.mh small{color:var(--ink-2);font-weight:500;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.mh small b{color:var(--ink)}
.bar{height:6px;border-radius:4px;background:var(--fill);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.hero-foot{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);border-top:1px solid var(--hair);padding-top:10px;margin-top:-2px}
.hero-foot b{color:var(--ink);font-variant-numeric:tabular-nums}
@media (max-width:360px){.hero{grid-template-columns:1fr;justify-items:center}.mac{width:100%}}
.tip{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;box-shadow:0 0 0 1px rgba(181,123,255,.5),0 0 26px rgba(181,123,255,.12)}
.tip-ico{font-size:24px}
.tip .t1{font-size:14.5px;line-height:1.4}
.tip .t1 b{color:var(--accent)}
.tip .t2{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.pills{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none;scroll-snap-type:x proximity}
.pills::-webkit-scrollbar{display:none}
.qpill{flex:none;border:0;color:var(--ink);background:var(--card);box-shadow:0 0 0 1px var(--hair);border-radius:999px;padding:6px 6px 6px 14px;font-size:14px;font-weight:550;display:flex;align-items:center;gap:8px;min-height:40px;scroll-snap-align:start;max-width:260px}
.qpill .qn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.qpill small{color:var(--ink-2);font-weight:500;white-space:nowrap}
.qpill i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.meal-row{position:relative}
.list>.meal-row+.meal-row::before{left:60px}
.mrow-head{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:0 12px 0 0}
.mrow{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;border:0;background:none;color:var(--ink);text-align:left;padding:12px 0 12px 14px;min-width:0;min-height:60px}
.mrow .chev{transition:transform .2s;margin-right:4px}
.meal-row.open .mrow .chev{transform:rotate(135deg)}
.rn{font-size:16px;font-weight:600;display:block}
.rs{font-size:13.5px;color:var(--ink-2);margin-top:1px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs.holo{color:var(--holo)}
.m-acts{display:flex;gap:6px;align-items:center}
.add-c{width:36px;height:36px;border-radius:50%;border:0;background:var(--fill);color:var(--accent);display:grid;place-items:center;font-size:22px;font-weight:500;line-height:1;padding:0;flex:none}
.add-c.on{background:var(--accent);color:var(--accent-ink)}
.entries{list-style:none;margin:0;padding:0 0 0 60px;display:flex;flex-direction:column}
.entry{width:100%;display:grid;grid-template-columns:1fr auto;gap:1px 12px;align-items:center;text-align:left;border:0;border-top:1px solid var(--hair);background:transparent;color:var(--ink);padding:10px 14px 10px 0}

.hist-list{list-style:none;padding:0;margin:0}

function fmt(n,d=0){if(n==null||isNaN(n))return "–";return Number(n).toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d})}
function fmtG(n){return Math.abs(n)<10?fmt(n,1):fmt(n)}
function fmtAmt(n){return fmt(n,n%1?1:0)}
function num(v){if(v==null)return NaN;return parseFloat(String(v).replace(",",".").trim())}
function keyOf(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseKey(k){const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(k,n){const d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d)}
const todayKey=()=>keyOf(new Date());
function dayTitle(k){const t=todayKey();if(k===t)return "Heute";if(k===addDays(t,-1))return "Gestern";if(k===addDays(t,1))return "Morgen";return parseKey(k).toLocaleDateString("de-DE",{weekday:"long"})}
function longDate(k){return parseKey(k).toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"long",year:"numeric"})}
function shortDate(k){const d=parseKey(k);return d.getDate()+"."+(d.getMonth()+1)+"."}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function norm(s){return String(s).toLowerCase().replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ß/g,"ss").normalize("NFD").replace(/[̀-ͯ]/g,"")}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}

function isFav(f){return S.favs.some(x=>fkey(x)===fkey(f))}
function slim(f){const o={name:f.name,brand:f.brand||"",kcal:f.kcal,p:f.p,c:f.c,f:f.f,portion:f.portion||null,src:f.src};if(f.fib!=null)o.fib=f.fib;if(f.sug!=null)o.sug=f.sug;if(f.code)o.code=f.code;if(f.id&&(f.src==="custom"||f.src==="recipe"))o.id=f.id;return o}

function ring(val,goal){
  const r=56,c=2*Math.PI*r,pct=goal>0?Math.min(val/goal,1):0,over=val>goal*1.05;
  return `<svg viewBox="0 0 132 132" aria-hidden="true"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fe1ff"/><stop offset="1" stop-color="#b57bff"/></linearGradient></defs>
  <circle cx="66" cy="66" r="${r}" fill="none" stroke="#172434" stroke-width="12"/>
  ${pct>0?`<circle class="prog" cx="66" cy="66" r="${r}" fill="none" stroke="${over?"var(--alert)":"url(#rg)"}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(c*pct).toFixed(1)} ${c.toFixed(1)}"/>`:""}</svg>`;
}
function macroBar(label,key,val,goal){
  const pct=goal>0?Math.min(val/goal*100,100):0,over=goal>0&&val>goal*1.05;
  return `<div><div class="mh"><span>${label}</span><small>${over?`<b style="color:var(--alert)">${fmt(val)}</b>`:fmt(val)} / ${fmt(goal)} g</small></div><div class="bar"><i style="width:${pct.toFixed(1)}%;background:var(--${key})"></i></div></div>`;
}
function kShort(v){return v>=1000?fmt(Math.round(v/100)/10,1)+"k":fmt(v)}
function shortName(n){return String(n).replace(/\s*\([^)]*\)/g,"").split(",")[0].trim()||String(n)}

  return `<div class="week">${[0,1,2,3,4,5,6].map(i=>{const kk=addDays(mon,i);let st="none",kc="–";
    if(hasEntries(kk)){const tt=dayTotals(kk),g=goalsFor(kk);st=Math.abs(tt.kcal-g.kcal)<=g.kcal*0.1?"in":"off";kc=kShort(tt.kcal)}
    const lab=`${parseKey(kk).toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"})}${st==="in"?", im Ziel":st==="off"?", getrackt":""}`;
    return `<button class="wd ${st} ${kk===t?"today":""} ${kk===cur?"sel":""} ${kk>t?"future":""}" data-action="pick-day" data-k="${kk}" aria-label="${lab}" ${kk===cur?'aria-current="date"':""}><span class="wd-day">${WD[(i+1)%7]}</span><span class="wd-num">${parseKey(kk).getDate()}</span><i class="wd-k">${kc}</i>${st==="in"?`<i class="wd-ok" aria-hidden="true">✓</i>`:""}</button>`}).join("")}</div>`;
}

function lastUsed(f){const k=fkey(f),t=todayKey();for(let i=0;i<21;i++){const d=S.days[addDays(t,-i)];if(!d)continue;for(let j=d.entries.length-1;j>=0;j--){const e=d.entries[j];if(!e.quick&&e.food&&fkey(e.food)===k)return {g:e.g,unit:e.unit||"g"}}}return null}

  if(u&&u.g>0)return {g:u.g,unit:u.unit==="portion"&&hasP?"portion":"g"};return hasP?{g:f.portion.g,unit:"portion"}:{g:100,unit:"g"}}

function mealNow(){const n=new Date(),h=n.getHours()+n.getMinutes()/60;return h<10.5?"fruehstueck":h<14.5?"mittag":h<17.5?"snacks":"abend"}
const QUICK=new Map(),openMeals=new Set();
function frequentFoods(n){const cnt=new Map(),end=todayKey();
  for(let i=0;i<30;i++){const d=S.days[addDays(end,-i)];if(!d)continue;d.entries.forEach(e=>{if(e.quick||!e.food)return;const k=fkey(e.food),c=cnt.get(k)||{f:e.food,n:0};c.n++;cnt.set(k,c)})}
  const out=[...cnt.values()].sort((a,b)=>b.n-a.n).map(x=>x.f);
  [...S.favs,...S.recent].forEach(f=>{if(!out.some(x=>sameFood(x,f)))out.push(f)});return out.slice(0,n)}
const PROT_RE=/^(Skyr natur|Magerquark|Körniger Frischkäse|Harzer Käse|Whey Proteinpulver|Hähnchenbrust \(roh\)|Thunfisch im eigenen Saft|Proteinpudding)/;
function proteinTip(t,g){
  const need=g.p-t.p;if(need<15)return null;const rest=g.kcal-t.kcal,seen=new Set();let best=null;
  [...frequentFoods(25),...FOODS.filter(f=>PROT_RE.test(f.name))].forEach(f=>{const k=fkey(f);if(seen.has(k))return;seen.add(k);
    if(!(f.kcal>0)||f.p*4/f.kcal<0.35)return;const u=usual(f),n=nutr(f,u.g);if(n.p<10)return;
    const s=Math.abs(need-n.p)+(n.p>need+25?15:0)+(n.kcal>Math.max(rest,0)+150?40:0)+(S.recent.some(x=>sameFood(x,f))?0:6);
    if(!best||s<best.s)best={f,u,n,s}});
  return best?Object.assign(best,{need}):null}

function weightTrend(){const all=weightSeries(),last=all[all.length-1];if(!last)return NaN;const r=all.filter(p=>p.k>=addDays(last.k,-27));if(r.length<3)return NaN;

async function b64urlFromBytes(bytes){let bin="";const ch=0x8000;for(let i=0;i<bytes.length;i+=ch)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+ch));return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}

function kcalChart(rows){

  const maxV=Math.max(...rows.map(r=>r.g.kcal*1.25),...rows.map(r=>r.t.kcal));const top=Math.ceil(maxV/500)*500;
  const y=v=>T+(H-T-B)*(1-v/top),bw=(W-L-R)/n,gap=Math.min(8,bw*0.25);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kalorien pro Tag"><defs><linearGradient id="bgr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c79bff"/><stop offset="1" stop-color="#9a62f0"/></linearGradient></defs>`;
  const step=top<=2000?500:(top<=4000?1000:1500);
  for(let v=0;v<=top;v+=step){s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`}
  // Ziellinie pro Tag (Stufen bei Trainings-/Ruhetagen)
  let gp="";rows.forEach((r,i)=>{const x0=L+i*bw,x1=x0+bw,yy=y(r.g.kcal).toFixed(1);gp+=(i?"L":"M")+x0.toFixed(1)+","+yy+" L"+x1.toFixed(1)+","+yy+" "});
  rows.forEach((r,i)=>{const x=L+i*bw+gap/2,h=H-B-y(r.t.kcal);const ok=Math.abs(r.t.kcal-r.g.kcal)<=r.g.kcal*0.1;
    if(r.n)s+=`<rect x="${x.toFixed(1)}" y="${y(r.t.kcal).toFixed(1)}" width="${(bw-gap).toFixed(1)}" height="${Math.max(h,0).toFixed(1)}" rx="${Math.min(5,(bw-gap)/2).toFixed(1)}" fill="${ok?"url(#bgr)":"var(--c)"}"><title>${shortDate(r.k)}: ${fmt(r.t.kcal)} kcal</title></rect>`;
    const every=n<=7?1:Math.ceil(n/6),show=n<=7||(n-1-i)%every===0;if(show)s+=`<text x="${(L+i*bw+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${n<=7?WD[parseKey(r.k).getDay()]:shortDate(r.k)}</text>`});
  const lg=rows[rows.length-1].g.kcal;
  s+=`<path d="${gp}" fill="none" stroke="var(--holo)" stroke-width="1.5" stroke-dasharray="5 4"/></svg>`;
  return s;
}

function weightChart(pts,all){
  const W=chartW(),H=230,L=40,R=12,T=14,B=26;
  const t0=parseKey(pts[0].k).getTime(),t1=Math.max(parseKey(pts[pts.length-1].k).getTime(),t0+864e5);
  const vals=pts.map(p=>p.v);let lo=Math.floor(Math.min(...vals)-0.5),hi=Math.ceil(Math.max(...vals)+0.5);if(hi-lo<2){hi+=1;lo-=1}

  for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step)s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`;
  const avg=pts.map(p=>({k:p.k,v:avgUpTo(all,p.k,7)}));
  const area=`M${x(avg[0].k)},${H-B} `+avg.map(p=>`L${x(p.k).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ")+` L${x(avg[avg.length-1].k)},${H-B}Z`;
  s+=`<path d="${area}" fill="var(--holo)" fill-opacity=".08"/>`;
  s+=`<path d="${avg.map((p,i)=>(i?"L":"M")+x(p.k).toFixed(1)+","+y(p.v).toFixed(1)).join(" ")}" fill="none" stroke="var(--holo)" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach(p=>s+=`<circle cx="${x(p.k).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3" fill="var(--card)" stroke="var(--ink-2)" stroke-width="1.5"><title>${shortDate(p.k)}: ${fmt(p.v,1)} kg</title></circle>`);
  const lastA=avg[avg.length-1];s+=`<circle cx="${x(lastA.k)}" cy="${y(lastA.v)}" r="5" fill="var(--holo)"/>`;

  s+=`</svg>`;

}

/* ---------- Adaptives Ziel: echten Verbrauch aus Essen + Gewichtstrend schätzen ----------
   Prinzip wie ein Kontoauszug: Gegessene kcal = Einzahlungen, Gewichtsänderung = Kontostand.
   1 kg Körpergewicht ≈ 7.700 kcal. Verbrauch = Ø gegessen − (Gewichtsänderung pro Tag × 7.700). */
const KCAL_PER_KG=7700;
function adaptiveEstimate(){
  const end=addDays(todayKey(),-1),W=28,start=addDays(end,-(W-1));
  const days=[];let partial=0;
  for(let i=0;i<W;i++){const k=addDays(start,i);if(!hasEntries(k))continue;const t=dayTotals(k),g=goalsFor(k);if(t.kcal<g.kcal*0.5){partial++;continue}days.push(t.kcal)}
  const ws=weightSeries().filter(p=>p.k>=start&&p.k<=end);
  const prior=calc(S.profile).tdee;
  const res={nDays:days.length,nW:ws.length,partial,prior,ready:false,needDays:10,needW:5,span:0};
  if(ws.length>=2)res.span=Math.round((parseKey(ws[ws.length-1].k)-parseKey(ws[0].k))/864e5);
  if(days.length<10||ws.length<5||res.span<10)return res;
  const xs=ws.map(p=>(parseKey(p.k)-parseKey(start))/864e5),ys=ws.map(p=>p.v);
  const mx=xs.reduce((a,b)=>a+b)/xs.length,my=ys.reduce((a,b)=>a+b)/ys.length;let nu=0,de=0;xs.forEach((x,i)=>{nu+=(x-mx)*(ys[i]-my);de+=(x-mx)**2});
  const slope=de>0?nu/de:0; // kg pro Tag
  const intake=days.reduce((a,b)=>a+b)/days.length;
  const observed=intake-slope*KCAL_PER_KG;
  const conf=Math.min(1,days.length/21)*Math.min(1,ws.length/10);
  const bounded=Math.min(Math.max(observed,prior*0.7),prior*1.3);
  const tdee=Math.round((conf*bounded+(1-conf)*prior)/10)*10;
  const lastW=avgUpTo(weightSeries(),end,7);
  return Object.assign(res,{ready:true,tdee,intake,slopeWeek:slope*7,observed,conf,capped:bounded!==observed,lastW});
}
function adaptiveSuggestion(a){

}

      ${a.partial?`<p class="sub">${a.partial} Tag(e) zählen nicht mit, weil weniger als die Hälfte deines Kalorienziels eingetragen ist (vermutlich unvollständig).</p>`:""}
      <p class="sub">Bis dahin nutzt die App die Formel (${fmt(a.prior)} kcal Gesamtumsatz).</p></section>`}
  const sg=adaptiveSuggestion(a),cur=currentAvgKcal(),diff=sg.kcal-cur,goalName=(GOALS.find(g=>g[0]===S.profile.goal)||GOALS[2])[1];
  return `<section class="card stack adapt"><div><h3><i class="emo">🧠</i>Dein echter Verbrauch</h3><p class="sub">Berechnet aus den letzten 4 Wochen: was du gegessen hast und wie sich dein Gewicht entwickelt hat.</p></div>
    <div class="adapt-big"><b>≈ ${fmt(a.tdee)}</b><span>kcal pro Tag</span></div>

      <div><small>Ø gegessen</small><b>${fmt(a.intake)} kcal</b><span>${a.nDays} vollständige Tage</span></div>

      <div><small>Formel sagte</small><b>${fmt(a.prior)} kcal</b><span>${a.tdee>a.prior?"+":""}${fmt(a.tdee-a.prior)} kcal Unterschied</span></div>
      <div><small>Verlässlichkeit</small><b>${confLabel(a.conf)}</b><span>${a.conf<0.8?"wird mit mehr Daten genauer":"genug Daten"}</span></div>
    </div>
    ${a.capped?`<p class="sub">⚠️ Die Rohdaten ergeben ${fmt(a.observed)} kcal – das weicht stark von der Formel ab. Oft fehlen Einträge (z. B. Snacks, Öl, Getränke). Die App begrenzt die Schätzung deshalb vorsichtig.</p>`:""}
    <div class="adapt-sugg"><div><small>Vorschlag für dein Ziel „${esc(goalName)}“</small><b>${fmt(sg.kcal)} kcal</b><span>P ${fmt(sg.p)} g · KH ${fmt(sg.c)} g · F ${fmt(sg.f)} g · ${Math.abs(diff)<30?"entspricht deinem aktuellen Ziel":`${diff>0?"+":""}${fmt(diff)} kcal gegenüber jetzt`}</span></div>
      <button class="btn primary" data-action="adapt-apply" ${Math.abs(diff)<30?"disabled":""}>Vorschlag übernehmen</button></div>
    <label class="switch"><input type="checkbox" id="adapt-on" ${S.adapt.on!==false?"checked":""}> Einmal pro Woche auf „Heute“ einen Vorschlag anzeigen</label>
    <details><summary>So funktioniert die Berechnung</summary><p class="sub">Stell dir dein Körpergewicht wie ein Konto vor: Essen ist die Einzahlung, dein Verbrauch die Abbuchung. Bleibt das Gewicht gleich, war beides gleich groß. Nimmst du pro Woche 0,5 kg ab, hast du täglich etwa 550 kcal mehr verbraucht als gegessen (0,5 kg × 7.700 kcal ÷ 7 Tage). Die App nimmt dafür den Trend aller Wiegungen der letzten 4 Wochen, damit Wasserschwankungen nicht stören. Tage mit weniger als der Hälfte deines Ziels zählen nicht, weil sie meist unvollständig sind. Am Anfang mischt die App die Formel noch mit ein – je mehr Daten, desto mehr zählt dein echter Wert.</p></details>
  </section>`;
}

/* ---------- Erinnerungen: Kalender (.ics / Google) + Hinweise in der App ---------- */
const REM_ITEMS=[["fruehstueck","🍳 Frühstück eintragen"],["mittag","🥗 Mittagessen eintragen"],["abend","🍝 Abendessen eintragen"],["snacks","🍎 Snacks eintragen"]];
function appUrl(){return location.href.split("#")[0].split("?")[0]}
function icsEsc(t){return String(t).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n")}
function icsFold(line){const out=[];let cur="",len=0;for(const ch of line){const b=new TextEncoder().encode(ch).length;if(len+b>73){out.push(cur);cur=" "+ch;len=1+b}else{cur+=ch;len+=b}}out.push(cur);return out.join("\r\n")}
function nextStart(hm){const [h,m]=hm.split(":").map(Number);const d=new Date();d.setHours(h,m,0,0);if(d<new Date())d.setDate(d.getDate()+1);return d}
function nextWeekday(hm,dow){const d=nextStart(hm);while(d.getDay()!==dow)d.setDate(d.getDate()+1);return d}
function icsDate(d){const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}T${p(d.getHours())}${p(d.getMinutes())}00`}
function reminderEvents(){const R=S.remind,ev=[];
  REM_ITEMS.forEach(([id,title])=>{if(R[id])ev.push({id,title:"MTC · "+title,label:title.replace(" eintragen",""),when:"täglich "+R[id],start:nextStart(R[id]),rrule:"FREQ=DAILY"})});
  if(R.weigh)ev.push({id:"weigh",title:"MTC · ⚖️ Wiegen & eintragen",label:"⚖️ Wiegen",when:(R.weighDays==="mon"?"montags ":"täglich ")+R.weigh,start:R.weighDays==="mon"?nextWeekday(R.weigh,1):nextStart(R.weigh),rrule:R.weighDays==="mon"?"FREQ=WEEKLY;BYDAY=MO":"FREQ=DAILY"});
  if(R.checkin)ev.push({id:"checkin",title:"MTC · 📋 Check-in an "+CONFIG.coachName+" senden",label:"📋 Check-in",when:"sonntags 18:00",start:nextWeekday("18:00",0),rrule:"FREQ=WEEKLY;BYDAY=SU"});
  return ev}
function buildICS(ids){if(!S.clientId){S.clientId=uid();save()}const now=new Date(),url=appUrl();
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//MTC-Fitness//Makrotracker//DE","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:"+icsEsc(CONFIG.brand+" Erinnerungen")];
  reminderEvents().filter(e=>!ids||ids.includes(e.id)).forEach(e=>{L.push("BEGIN:VEVENT","UID:mtc-"+e.id+"-"+S.clientId+"@mtc-fitness","DTSTAMP:"+now.toISOString().replace(/[-:]/g,"").replace(/\.\d+/,""),
    "DTSTART:"+icsDate(e.start),"DURATION:PT5M","RRULE:"+e.rrule,"SUMMARY:"+icsEsc(e.title),"DESCRIPTION:"+icsEsc("Kurz im "+CONFIG.brand+" Makrotracker eintragen: "+url),"URL:"+url,"TRANSP:TRANSPARENT",
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(e.title),"TRIGGER:PT0M","END:VALARM","END:VEVENT")});
  L.push("END:VCALENDAR");return L.map(icsFold).join("\r\n")+"\r\n"}
function googleLink(e){const end=new Date(e.start.getTime()+5*60000);
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||"Europe/Berlin";
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(e.title)+"&dates="+icsDate(e.start)+"/"+icsDate(end)+"&ctz="+encodeURIComponent(tz)+"&recur="+encodeURIComponent("RRULE:"+e.rrule)+"&details="+encodeURIComponent("Kurz im Makrotracker eintragen: "+appUrl())}
/* Kalender-Export nur nach ausdrücklicher Auswahl – vorher ist nichts angehakt */
function calModal(){const ev=reminderEvents();

  modal(`<h3>📅 Welche Termine?</h3><p>Ausgewählte Erinnerungen landen als <b>wiederkehrende Termine</b> in deinem Kalender. Wähle nur, was du wirklich brauchst.</p>
  <div class="cal-pick">${ev.map(e=>`<label><input type="checkbox" data-cal="${e.id}"> ${esc(e.label)}<small>${esc(e.when)}</small></label>`).join("")}</div>

async function addToCalendar(ids){
  const ev=reminderEvents().filter(e=>ids.includes(e.id));if(!ev.length)return;
  const ics=buildICS(ids),name="MTC-Erinnerungen.ics";const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  if(isIOS){location.href="data:text/calendar;charset=utf-8,"+encodeURIComponent(ics);return}
  try{const file=new File([ics],name,{type:"text/calendar"});if(navigator.canShare&&navigator.canShare({files:[file]})&&/Android/.test(navigator.userAgent)){await navigator.share({files:[file],title:"Erinnerungen"});return}}catch(err){if(err&&err.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);

}

    ${ev.length?`<details><summary>Android / Google Kalender: einzeln hinzufügen</summary><div class="stack" style="margin-top:10px">${ev.map(e=>`<a class="btn sm" href="${googleLink(e)}" target="_blank" rel="noopener">➕ ${esc(e.label)} · ${esc(e.when)}</a>`).join("")}<p class="sub" style="margin:0">Stell beim Speichern die Benachrichtigung auf „Zum Zeitpunkt des Termins“.</p></div></details>`:""}

function nudgeBanner(){
  const R=S.remind;if(R.nudges===false||cur!==todayKey())return "";const day=S.days[cur]||{entries:[]};if(day.nudgeOff)return "";
  const now=new Date(),mins=now.getHours()*60+now.getMinutes(),past=t=>{if(!t)return false;const [h,m]=t.split(":").map(Number);return mins>=h*60+m+30};

async function exportFile(){

function renderResults(){

    else {items=S.custom.filter(f=>f.src!=="recipe");h+=`<div class="quick-row"><button class="btn sm" data-sh="custom">✏️ Lebensmittel anlegen</button></div>`;empty=`<div class="status">Hier landen Lebensmittel, die du selbst anlegst – z. B. vom Bäcker oder aus der Kantine.</div>`}

  } else {

    const score=f=>{const n=norm(f.name);let s=0;if(n.startsWith(words[0]))s-=3;else if(new RegExp("(^|[\\s(/-])"+escRe(words[0])).test(n))s-=2;if(isFav(f))s-=4;if(f.src!=="db")s-=1;if(POP.test(f.name))s-=1.5;return s+n.length/100};

    if(BLS){const w0=words[0],re0=new RegExp("(^|[\\s(/,-])"+escRe(w0));

    else if(offState.status==="offline")h+=`<div class="status">📴 Du bist offline. Die eingebaute Liste und deine eigenen Lebensmittel funktionieren trotzdem.</div>`;
    else if(offState.status==="error")h+=`<div class="status">Online-Suche gerade nicht erreichbar. <button class="btn sm" data-sh="off-retry">Erneut versuchen</button></div>`;

  }

const OFF_FIELDS="code,product_name,product_name_de,brands,nutriments,serving_quantity,serving_size";
function mapOff(p){if(!p)return null;const n=p.nutriments||{};let kcal=n["energy-kcal_100g"];if(kcal==null&&n["energy_100g"]!=null)kcal=n["energy_100g"]/4.184;const name=(p.product_name_de||p.product_name||"").trim();
  if(kcal==null||!name)return null;const brand=Array.isArray(p.brands)?p.brands.join(", "):(p.brands||"");const sq=parseFloat(p.serving_quantity);
  return {id:"off"+(p.code||name),name,brand:brand.split(",")[0].trim(),kcal:+kcal||0,p:+n.proteins_100g||0,c:+n.carbohydrates_100g||0,f:+n.fat_100g||0,fib:n.fiber_100g!=null?+n.fiber_100g:undefined,sug:n.sugars_100g!=null?+n.sugars_100g:undefined,portion:sq>0?{label:"1 Portion",g:sq}:null,src:"off"}}
async function offBarcode(code,signal){
  const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=${OFF_FIELDS}`,{signal});
  if(r.status===404)return null;if(!r.ok)throw new Error("http "+r.status);
  const j=await r.json();if(j.status!==1)return null;const f=mapOff(j.product);if(f)f.code=code;return f;
}
async function offFetch(q,signal){
  if(/^\d{8,14}$/.test(q)){const f=await offBarcode(q,signal);return f?[f]:[]}
  const qs=`q=${encodeURIComponent(q)}&langs=de&page_size=30&fields=${OFF_FIELDS}`;
  let r=null;
  /* 1. Über die eigene Weiterleitung (_redirects) – umgeht die CORS-Sperre von Open Food Facts */
  try{r=await fetch(`api/off-search?${qs}`,{signal,headers:{Accept:"application/json"}});const ct=r.headers.get("content-type")||"";if(!r.ok||!ct.includes("json"))r=null}catch(e){if(signal.aborted)throw e;r=null}
  /* 2. Direkt (klappt nur, falls Open Food Facts CORS erlaubt) */
  if(!r)r=await fetch(`https://search.openfoodfacts.org/search?${qs}`,{signal});
  if(!r.ok)throw new Error("http "+r.status);
  const j=await r.json();
  return (j.hits||j.products||[]).map(mapOff).filter(Boolean).filter(f=>f.kcal>0||f.p>0||f.c>0||f.f>0);
}
function scheduleOff(force){
  clearTimeout(offTimer);if(offCtl)offCtl.abort();const q=SH.query.trim();
  if(q.length<3)return;
  if(!force&&offCache.has(q)){offState={q,status:"done",items:offCache.get(q)};return}
  if(navigator.onLine===false){offState={q,status:"offline",items:[]};return}
  offState={q,status:"loading",items:[]};
  offTimer=setTimeout(async()=>{offCtl=new AbortController();const ctl=offCtl;
    try{const items=(await offFetch(q,ctl.signal)).slice(0,30);if(ctl.signal.aborted)return;offCache.set(q,items);offState={q,status:"done",items}}
    catch(e){if(ctl.signal.aborted)return;offState={q,status:navigator.onLine===false?"offline":"error",items:[]}}
    if(SH&&SH.mode==="search"&&SH.query.trim()===q)renderResults();},force?0:900);
}

/* ---------- Barcode-Scanner ---------- */
const SCAN={stream:null,timer:null,det:null};
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[data-src="${src}"]`))return res();const el=document.createElement("script");el.src=src;el.dataset.src=src;el.onload=res;el.onerror=()=>rej(new Error("load"));document.head.appendChild(el)})}
async function getDetector(){
  if(SCAN.det)return SCAN.det;
  const fm=["ean_13","ean_8","upc_a","upc_e"];
  try{if("BarcodeDetector" in window){const sup=await window.BarcodeDetector.getSupportedFormats();const ok=fm.filter(f=>sup.includes(f));if(ok.length){SCAN.det=new window.BarcodeDetector({formats:ok});return SCAN.det}}}catch(e){}
  await loadScript("lib/barcode-detector.js");
  const api=window.BarcodeDetectionAPI;
  api.prepareZXingModule({overrides:{locateFile:(p,pre)=>p.endsWith(".wasm")?new URL("lib/zxing_reader.wasm",location.href).href:pre+p}});
  SCAN.det=new api.BarcodeDetector({formats:fm});return SCAN.det;
}
function camError(e){const n=e&&e.name;
  if(!window.isSecureContext)return "Die Kamera funktioniert nur, wenn die App über https geöffnet wird.";
  if(n==="NotAllowedError")return "Kamerazugriff wurde nicht erlaubt. Erlaube die Kamera in den Einstellungen deines Handys für diese App – oder nutze „Foto vom Barcode“.";
  if(n==="NotFoundError"||n==="OverconstrainedError")return "Keine Kamera gefunden. Nutze „Foto vom Barcode“ oder tippe die Nummer ein.";
  if(e&&e.message==="load")return "Der Scanner konnte nicht geladen werden. Prüfe deine Internetverbindung.";
  return "Kamera konnte nicht gestartet werden. Nutze „Foto vom Barcode“ oder tippe die Nummer ein.";}
async function startScan(){
  const v=$("#scan-video"),st=$("#scan-status");if(!v)return;
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw Object.assign(new Error("nomedia"),{name:"NotFoundError"});
    const detP=getDetector();
    SCAN.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});
    if(!SH||SH.mode!=="scan"){stopScan();return}
    v.srcObject=SCAN.stream;await v.play();
    const det=await detP;st.textContent="Halte den Barcode ruhig in den Rahmen";
    const loop=async()=>{if(!SCAN.stream)return;
      try{if(v.readyState>=2){const r=await det.detect(v);const hit=r&&r.find(x=>/^\d{8,14}$/.test(x.rawValue));if(hit){stopScan();if(navigator.vibrate)navigator.vibrate(60);onBarcode(hit.rawValue);return}}}catch(e){}
      SCAN.timer=setTimeout(loop,160)};
    loop();
  }catch(e){stopScan();if(st)st.textContent=camError(e)}
}
function stopScan(){clearTimeout(SCAN.timer);if(SCAN.stream){SCAN.stream.getTracks().forEach(t=>t.stop());SCAN.stream=null}}
async function scanPhoto(file){
  const st=$("#scan-status");if(st)st.textContent="Foto wird ausgewertet …";
  try{const det=await getDetector();const bmp=await createImageBitmap(file);const r=await det.detect(bmp);const hit=r&&r.find(x=>/^\d{8,14}$/.test(x.rawValue));
    if(hit){stopScan();onBarcode(hit.rawValue)}else if(st)st.textContent="Kein Barcode erkannt. Versuch ein schärferes Foto, nah und gerade.";}
  catch(e){if(st)st.textContent=camError(e)}
}
async function onBarcode(code){
  if(!SH)return;SH.scanCode=code;
  const own=[...S.custom,...S.recent,...S.favs].find(f=>f.code===code);
  if(own){openFood(own);return}
  SH.mode="scan-result";SH.scanRes={loading:true};renderSheet();
  try{const f=await offBarcode(code);if(!SH||SH.scanCode!==code)return;
    if(f){openFood(f);toast("✅ Produkt gefunden")}else{SH.scanRes={};renderSheet()}}
  catch(e){if(!SH)return;SH.scanRes={error:navigator.onLine===false?"Du bist offline. Der Barcode kann erst mit Internet nachgeschlagen werden.":"Open Food Facts ist gerade nicht erreichbar. Versuch es gleich nochmal."};renderSheet()}
}
function openFood(f){SH.food=f;const hasP=f.portion&&f.portion.g;SH.unit=hasP?"portion":"g";SH.g=hasP?f.portion.g:100;SH.mode="detail";renderSheet();setTimeout(()=>{const i=$("#amt");i&&i.select()},30)}

    toast(`✓ ${f.name} hinzugefügt`,{label:"Rückgängig",fn:()=>{removeEntry(k,en.id);render();if(b.isConnected){b.classList.remove("on");b.textContent="+";b.disabled=false}}});break}
  case "off-retry":scheduleOff(true);renderResults();break;
  case "pick":{const f=pickMap.get(b.dataset.key);if(!f)return;SH.food=f;const hasP=f.portion&&f.portion.g;SH.unit=hasP?"portion":"g";SH.g=hasP?f.portion.g:100;SH.mode="detail";renderSheet();setTimeout(()=>{const i=$("#amt");i&&i.select()},30);break}
  case "back":if(["detail","quick","custom","scan","scan-result"].includes(SH.mode)){stopScan();SH.mode="search";renderSheet();focusFirst()}break;
  case "to-recipe":SH.mode="recipe";SH.target="meal";SH.query="";renderSheet();break;
  case "custom":SH.mode="custom";SH.editId=null;renderSheet();focusFirst();break;
  case "quick":SH.mode="quick";SH.quickVals=null;renderSheet();focusFirst();break;
  case "recipe-new":SH.mode="recipe";SH.recipe={name:"",items:[],total:"",portions:4};SH.editId=null;renderSheet();focusFirst();break;
  case "r-add":SH.mode="search";SH.target="recipe";SH.query="";renderSheet();focusFirst();break;
  case "r-del":SH.recipe.items.splice(+b.dataset.i,1);renderSheet();break;
  case "recipe-save":{const food=saveRecipe();if(!food)return;
    if(SH.meal){SH.editId=null;SH.target="meal";SH.food=food;SH.unit="portion";SH.g=food.portion.g;SH.mode="detail";renderSheet();toast("Rezept gespeichert")}
    else{closeSheet();render();toast("Rezept gespeichert")}break}
  case "custom-save":{const food=saveCustomFood();if(!food)return;
    if(SH.meal||SH.target==="recipe"){SH.editId=null;SH.food=food;SH.unit=food.portion?"portion":"g";SH.g=food.portion?food.portion.g:100;SH.mode="detail";renderSheet();toast("Gespeichert – findest du künftig in der Suche")}
    else{closeSheet();render();toast("Gespeichert")}break}
  case "quick-save":{const v=id=>num($(id).value);const kc=v("#q-kcal");if(isNaN(kc)||kc<0){toast("Bitte mindestens die Kalorien eingeben");return}
    const food={name:$("#q-name").value.trim()||"Schnelleintrag",brand:"",kcal:kc,p:v("#q-p")||0,c:v("#q-c")||0,f:v("#q-f")||0,portion:null,src:"quick"};const qf=v("#q-fib");if(!isNaN(qf))food.fib=qf;
    const d=getDay(cur,true);if(SH.entryId){const en=d.entries.find(x=>x.id===SH.entryId);if(en){en.food=food;en.meal=SH.meal}}else d.entries.push({id:uid(),meal:SH.meal,food,g:100,quick:true});
    const was=!!SH.entryId;save();closeSheet();render();toast(was?"Gespeichert":"Schnelleintrag hinzugefügt");break}
  case "unit":{const u=b.dataset.u;if(u===SH.unit)return;SH.unit=u;if(u==="portion"&&SH.food.portion){SH.g=Math.max(0.5,Math.round(SH.g/SH.food.portion.g*2)/2)*SH.food.portion.g}renderSheet();break}
  case "inc":{const pu=SH.unit==="portion";setShown(shownVal()+(pu?0.5:10));break}
  case "dec":{const pu=SH.unit==="portion";setShown(shownVal()-(pu?0.5:10));break}
  case "chip":setShown(+b.dataset.v);break;
  case "meal":SH.meal=b.dataset.m;sheet.querySelectorAll('[data-sh="meal"]').forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.m===SH.meal)));{const eb=sheet.querySelector(".sheet-head .eyebrow");if(eb&&!SH.entryId&&SH.target==="meal")eb.textContent="Zu "+mealLabel(SH.meal)}break;
  case "fav":{const f=slim(SH.food);if(isFav(f)){S.favs=S.favs.filter(x=>!sameFood(x,f));toast("Aus Favoriten entfernt")}else{S.favs.unshift(f);toast("Zu Favoriten hinzugefügt")}save();b.setAttribute("aria-pressed",String(isFav(f)));break}
  case "confirm":confirmEntry();break;
  case "delete":{const id=SH.entryId;closeSheet();deleteEntry(cur,id);break}
  }
});

/* Tageswechsel um Mitternacht, wenn die App offen bleibt */
let lastToday=todayKey();setInterval(()=>{const t=todayKey();if(t!==lastToday){if(cur===lastToday)cur=t;lastToday=t;if(!sheet.open)render()}},60000);

renderBanner();render();
(function startModals(){
  const logo=CONFIG.logo?`<img class="m-logo" src="${CONFIG.logo}" alt="">`:"";
  if(pendingCoach){const o=pendingCoach,pg=o.g,mt=o.m?String(o.m).slice(0,600):"";
    if(mt){S.coachMsg={t:mt,ts:Date.now()};save()}
    const msg=mt?`<p class="msg">${esc(mt)}</p>`:"";
    if(!(pg&&pg.kcal>0)){modal(`${logo}<h3>Nachricht von ${esc(CONFIG.coachName)}</h3>${msg}<button class="btn primary wide" data-action="coach-msg-ok">Danke, gelesen</button>`);return}
    modal(`${logo}<h3>${mt?"Nachricht & neue Ziele":"Neue Ziele"} von ${esc(CONFIG.coachName)}</h3>${msg}<p>Dein Coach hat dir neue Tagesziele geschickt${pendingCoach.r?" – mit eigenen Zielen für Ruhetage":""}.</p>
      <div class="m-goals"><div><b>${fmt(pg.kcal)}</b><span>kcal</span></div><div><b>${fmt(pg.p)}</b><span>Protein g</span></div><div><b>${fmt(pg.c)}</b><span>KH g</span></div><div><b>${fmt(pg.f)}</b><span>Fett g</span></div></div>
      <button class="btn primary wide" data-action="coach-apply">Ziele übernehmen</button><button class="text-btn" data-action="coach-later">Später</button>`);return}
  const fresh=!S.goalsSet&&!S.onboarded&&!Object.keys(S.days).some(hasEntries);
  if(fresh)modal(`${logo}<h3>Willkommen bei ${esc(CONFIG.brand)} ${esc(CONFIG.brandSub)}</h3><p>Dein Makrotracker für das Coaching mit ${esc(CONFIG.coachName)}.</p>
    <ul class="m-steps"><li><span>🎯</span><div><b>Ziele einrichten</b><small>Einmal kurz rechnen lassen – dauert eine Minute.</small></div></li><li><span>📷</span><div><b>Essen eintragen</b><small>Suchen, Barcode scannen oder Rezepte speichern.</small></div></li><li><span>📤</span><div><b>Mit deinem Coach teilen</b><small>Einmal pro Woche per Link – deine Daten bleiben auf dem Handy.</small></div></li></ul>
    <label class="field" style="text-align:left"><span class="label">Dein Vorname</span><input class="input" id="ob-name" maxlength="40" autocomplete="given-name" placeholder="z. B. Max"></label>
    <button class="btn primary wide" data-action="ob-start">Los geht’s</button><button class="text-btn" data-action="ob-later">Erst mal umschauen</button>`,true);
})();
})();
</script>
